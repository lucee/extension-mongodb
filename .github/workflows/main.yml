name: Java CI Combined

# Push publishes the -SNAPSHOT version already in pom.xml to the Sonatype snapshot repo.
# A manual run picks a type: release (default) X.Y.Z.N, rc X.Y.Z.N-RC, beta X.Y.Z.N-BETA, alpha X.Y.Z.N-ALPHA
# (N from the -SNAPSHOT in pom.xml), then commits the next -SNAPSHOT. Type "snapshot" only deploys the current snapshot.
# Where each version goes:
#   final (X.Y.Z.N) and -SNAPSHOT: mvn deploy (Maven Central / snapshot repo)
#   -RC, -BETA, -ALPHA:            mvn install (signed) and a GitHub release; never Central
# A push to a branch with a -SNAPSHOT version also commits the next -SNAPSHOT after the deploy,
# so every commit gets its own build number. The bump commit itself does not bump again.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      type:
        description: 'What to publish: release (X.Y.Z.N), rc (-RC), beta (-BETA), alpha (-ALPHA), or snapshot (deploy the current -SNAPSHOT, no bump)'
        type: choice
        options:
          - release
          - rc
          - beta
          - alpha
          - snapshot
        default: release

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.VERSION }}
      release: ${{ steps.extract-version.outputs.RELEASE }}
      next_version: ${{ steps.extract-version.outputs.NEXT_VERSION }}
      publish: ${{ steps.publish.outputs.PUBLISH }}
    steps:
      # Only pushes and manual runs on master/main, a version branch (1.0, 2.0, ...) or release/* may
      # publish (deploy) or commit (bump). Feature and PR branches only build and test.
      - name: Decide whether this run may publish
        id: publish
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          PUBLISH=false
          if [[ "$EVENT" == "push" || "$EVENT" == "workflow_dispatch" ]]; then
            BRANCH="${REF#refs/heads/}"
            if [[ "$REF" == refs/heads/* ]] && [[ "$BRANCH" == "master" || "$BRANCH" == "main" || "$BRANCH" =~ ^[0-9]+(\.[0-9]+)*$ || "$BRANCH" == release/* ]]; then
              PUBLISH=true
            fi
          fi
          echo "event=${EVENT} ref=${REF} publish=${PUBLISH}"
          echo "PUBLISH=${PUBLISH}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Extract version number
        id: extract-version
        env:
          # A manual run releases unless the box is snapshot. Push and pull_request never do.
          RELEASE_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.type || 'snapshot' }}
        run: |
          set -euo pipefail
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | tr -d '\r')
          RELEASE=false
          NEXT_VERSION=""
          case "$RELEASE_TYPE" in
            release) SUFFIX="" ;;
            rc) SUFFIX="-RC" ;;
            beta) SUFFIX="-BETA" ;;
            alpha) SUFFIX="-ALPHA" ;;
            snapshot) SUFFIX="none" ;;
            *) echo "::error::unknown release type [${RELEASE_TYPE}]"; exit 1 ;;
          esac
          if [[ "$SUFFIX" != "none" ]]; then
            if [[ "$VERSION" != *-SNAPSHOT ]]; then
              echo "::error::A release run needs a -SNAPSHOT version in pom.xml (found ${VERSION})"
              exit 1
            fi
            RELEASE_VERSION="${VERSION%-SNAPSHOT}"
            if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){3}$ ]]; then
              echo "::error::[${RELEASE_VERSION}] is not a 4-part release version"
              exit 1
            fi
            PREFIX="${RELEASE_VERSION%.*}"
            LAST="${RELEASE_VERSION##*.}"
            NEXT_VERSION="${PREFIX}.$((10#$LAST + 1))-SNAPSHOT"
            VERSION="${RELEASE_VERSION}${SUFFIX}"
            if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){3}(-RC|-BETA|-ALPHA)?$ ]]; then
              echo "::error::[${VERSION}] is not a valid release version"
              exit 1
            fi
            RELEASE=true
            echo "Release run: publish ${VERSION}, then bump pom.xml to ${NEXT_VERSION}"
          fi
          echo "Using VERSION=${VERSION} RELEASE=${RELEASE} NEXT_VERSION=${NEXT_VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "RELEASE=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "NEXT_VERSION=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Cache Lucee files
        uses: actions/cache@v4
        with:
          path: ~/work/_actions/lucee/script-runner/main/lucee-download-cache
          key: lucee-downloads

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

  build-and-test:
    runs-on: ubuntu-latest
    needs: setup
    env:
      LUCEE_TEST_VERSIONS_PLUS: ${{ vars.LUCEE_TEST_VERSIONS_PLUS }}
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    strategy:
      matrix:
        lucee: ${{ fromJSON(vars.LUCEE_TEST_VERSIONS_PLUS) }}
    steps:

      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # A release run builds the version with -SNAPSHOT removed, the same one deploy publishes.
      - name: Set the version for this run
        if: needs.setup.outputs.release == 'true'
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          python3 - "$VERSION" <<'PY'
          import pathlib, re, sys
          new = sys.argv[1]
          path = pathlib.Path("pom.xml")
          text = path.read_text()
          pattern = r"(<artifactId>mongodb-extension</artifactId>\s*<version>)[^<]+(</version>)"
          text2, n = re.subn(pattern, lambda m: m.group(1) + new + m.group(2), text, count=1)
          if n != 1:
              raise SystemExit(f"project version was not updated (matches={n})")
          path.write_text(text2)
          print(f"pom.xml version is now {new}")
          PY

      - name: Build and Install with Maven
        run: |
          echo "------- Maven Install -------";
          mvn -B -e -f pom.xml clean install

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-lex-${{ matrix.lucee.version }}
          path: |
            target/*.lex
            !target/*.lite.lex

      - name: Checkout Lucee
        uses: actions/checkout@v4
        with:
          repository: lucee/lucee
          path: lucee

      - name: Run Lucee Test Suite
        uses: lucee/script-runner@main
        with:
          webroot: ${{ github.workspace }}/lucee/test
          execute: /bootstrap-tests.cfm
          luceeVersion: ${{ matrix.lucee.version }}
          luceeVersionQuery: ${{ matrix.lucee.query }}
          extensionDir: ${{ github.workspace }}/target
          extensions: 87FE44E5-179C-43A3-A87B3D38BEF4652E
        env:
          testLabels: mongodb
          testAdditional: ${{ github.workspace }}/tests
          LUCEE_ENABLE_WARMUP: 'true'
          MONGODB_SERVER: localhost
          MONGODB_PORT: 27017
          MONGODB_DB: lucee
          MONGODB_DATABASE: lucee

  deploy:
    runs-on: ubuntu-latest
    needs: [setup, build-and-test]
    # deploy only from pushes or manual runs on publishable branches, never for pull requests or other branches
    if: always() && needs.build-and-test.result == 'success' && needs.setup.outputs.publish == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Install Maven 3.9.16
        # ubuntu-latest moved to Maven 3.10.0 (Oct 2026), which stages maven-metadata-local.xml
        # in the deploy bundle; Central then rejects it
        # ("Bundle has content that does NOT have a .pom file"). Pin 3.9.16 for the deploy.
        run: |
          curl -fsSL -o /tmp/maven.tar.gz https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  /tmp/maven.tar.gz" | sha512sum -c -
          tar -xzf /tmp/maven.tar.gz -C /tmp
          echo "/tmp/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
          /tmp/apache-maven-3.9.16/bin/mvn -v

      # A release run publishes the version with -SNAPSHOT removed.
      - name: Set the version for this run
        if: needs.setup.outputs.release == 'true'
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          python3 - "$VERSION" <<'PY'
          import pathlib, re, sys
          new = sys.argv[1]
          path = pathlib.Path("pom.xml")
          text = path.read_text()
          pattern = r"(<artifactId>mongodb-extension</artifactId>\s*<version>)[^<]+(</version>)"
          text2, n = re.subn(pattern, lambda m: m.group(1) + new + m.group(2), text, count=1)
          if n != 1:
              raise SystemExit(f"project version was not updated (matches={n})")
          path.write_text(text2)
          print(f"pom.xml version is now {new}")
          PY

      - name: Build and Deploy with Maven
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "${VERSION}" == *-SNAPSHOT ]]; then
            echo "------- Maven Deploy snapshot ${VERSION} on ${{ github.event_name }} -------";
            mvn -B -e -f pom.xml clean deploy --settings maven-settings.xml
          elif [[ "${VERSION}" =~ -(RC|BETA|ALPHA)$ ]]; then
            # pre-releases are not published to Maven Central; the github-release job publishes the .lex
            echo "------- Maven Install (signed) ${VERSION} on ${{ github.event_name }}, GitHub release only -------";
            mvn -B -e -f pom.xml clean install -DperformRelease=true --settings maven-settings.xml
          else
            echo "------- Maven Deploy release ${VERSION} on ${{ github.event_name }} -------";
            mvn -B -e -f pom.xml clean deploy -DperformRelease=true --settings maven-settings.xml
          fi

      # LDEV-6696: the published .lex files (full and lite) for the github-release job
      - name: Upload artifact for GitHub release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-release
          path: target/*.lex

  # LDEV-6696: publish every final, ALPHA, BETA and RC build as a GitHub release with its .lex files attached,
  # so ext.lucee.org can redirect downloads to GitHub releases (LDEV-6511). -SNAPSHOT builds get no GitHub release.
  # Separate job, so a failure here never blocks the Maven Central deploy.
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [setup, deploy]
    # only from publishable branches, like the deploy job
    if: >-
      always() && needs.deploy.result == 'success'
      && needs.setup.outputs.publish == 'true'
      && !endsWith(needs.setup.outputs.version, '-SNAPSHOT')
    permissions:
      # create the release (and its tag) and upload its assets
      contents: write
    steps:
      # the files the deploy job built and published
      - name: Download published extension
        uses: actions/download-artifact@v4
        with:
          name: mongodb-release
          path: release-files

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.setup.outputs.version }}
          IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find release-files -type f \( -name "*-${VERSION}.lex" -o -name "*-${VERSION}.lite.lex" \) | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::no .lex files for $VERSION found"; find release-files -type f; exit 1
          fi
          printf 'Asset: %s\n' "${FILES[@]}"

          # the release tag is the exact published version (3.4.4.1 or 3.4.4.1-RC), created on this commit
          # if it does not exist yet. ALPHA/BETA/RC are pre-releases and never "latest".
          if [[ "$VERSION" == *-* ]]; then
            PRE=(--prerelease --latest=false)
          elif [ "$IS_DEFAULT_BRANCH" == "true" ]; then
            PRE=(--latest)
          else
            PRE=(--latest=false)
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists - uploading assets again"
            gh release upload "$VERSION" "${FILES[@]}" --clobber
          else
            echo "Creating release $VERSION ${PRE[*]} on $GITHUB_SHA"
            gh release create "$VERSION" "${FILES[@]}" "${PRE[@]}" --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes "Build $VERSION from commit $GITHUB_SHA, published by $RUN_URL"
          fi

  # After a release deploy, or a SNAPSHOT deploy on a push, commit the next -SNAPSHOT.
  # No loop: the push uses the workflow token, which does not start another workflow run,
  # and runs started by github-actions[bot] or with the bump message are skipped anyway.
  bump:
    runs-on: ubuntu-latest
    needs: [setup, deploy]
    if: >-
      always() && needs.deploy.result == 'success'
      && needs.setup.outputs.publish == 'true'
      && (needs.setup.outputs.release == 'true'
        || (github.event_name == 'push'
          && startsWith(github.ref, 'refs/heads/')
          && endsWith(needs.setup.outputs.version, '-SNAPSHOT')
          && github.actor != 'github-actions[bot]'
          && !startsWith(github.event.head_commit.message, 'Set version to ')
          && !contains(github.event.head_commit.message, '[skip ci]')))
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Bump to the next SNAPSHOT
        env:
          NEXT_VERSION: ${{ needs.setup.outputs.next_version }}
          DEPLOYED_VERSION: ${{ needs.setup.outputs.version }}
          IS_RELEASE: ${{ needs.setup.outputs.release }}
        run: |
          set -euo pipefail
          if [[ "$IS_RELEASE" != "true" ]]; then
            # push: bump from the version on the branch tip, only if nobody bumped it since this deploy
            CURRENT=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | tr -d '\r')
            if [[ "$CURRENT" != "$DEPLOYED_VERSION" ]]; then
              echo "Branch is at ${CURRENT}, deployed ${DEPLOYED_VERSION}; already bumped, nothing to do"
              exit 0
            fi
            BASE="${CURRENT%-SNAPSHOT}"
            if ! [[ "$BASE" =~ ^[0-9]+(\.[0-9]+){3}$ ]]; then
              echo "::warning::[${CURRENT}] is not a 4-part SNAPSHOT version, not bumping"
              exit 0
            fi
            NEXT_VERSION="${BASE%.*}.$((10#${BASE##*.} + 1))-SNAPSHOT"
            echo "Push run: bump pom.xml from ${CURRENT} to ${NEXT_VERSION}"
          fi
          if [[ -z "$NEXT_VERSION" ]]; then
            echo "::error::next version was not resolved"
            exit 1
          fi
          python3 - "$NEXT_VERSION" <<'PY'
          import pathlib, re, sys
          new = sys.argv[1]
          path = pathlib.Path("pom.xml")
          text = path.read_text()
          pattern = r"(<artifactId>mongodb-extension</artifactId>\s*<version>)[^<]+(</version>)"
          text2, n = re.subn(pattern, lambda m: m.group(1) + new + m.group(2), text, count=1)
          if n != 1:
              raise SystemExit(f"project version was not updated (matches={n})")
          path.write_text(text2)
          print(f"pom.xml version is now {new}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          if git diff --cached --quiet; then
            echo "pom.xml already at ${NEXT_VERSION}"
            exit 0
          fi
          git commit -m "Set version to ${NEXT_VERSION}"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
